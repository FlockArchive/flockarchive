<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flock Archiver{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            line-height: 1.6;
        }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header {
            background: #111;
            border-bottom: 2px solid #c0392b;
            padding: 16px 0;
            margin-bottom: 24px;
        }
        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 { color: #fff; font-size: 1.4rem; }
        header h1 span { color: #c0392b; }
        nav a {
            color: #aaa;
            text-decoration: none;
            margin-left: 20px;
            font-size: 0.9rem;
        }
        nav a:hover { color: #fff; }
        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 16px 24px;
            flex: 1;
        }
        .stat-card .number { font-size: 2rem; font-weight: bold; color: #fff; }
        .stat-card .label { font-size: 0.85rem; color: #888; }
        .stat-card.changed .number { color: #e74c3c; }
        .submit-form {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
            display: flex;
            gap: 12px;
        }
        .submit-form input[type="text"] {
            flex: 1;
            background: #222;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.95rem;
        }
        .submit-form input[type="text"]:focus {
            outline: none;
            border-color: #c0392b;
        }
        .btn {
            background: #c0392b;
            color: #fff;
            border: none;
            border-radius: 4px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { background: #e74c3c; }
        .btn-secondary {
            background: #333;
            color: #ccc;
        }
        .btn-secondary:hover { background: #444; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1a1a1a;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td { padding: 12px 16px; text-align: left; }
        th {
            background: #222;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #888;
        }
        tr { border-bottom: 1px solid #2a2a2a; }
        tr:hover { background: #222; }
        td a { color: #6db3f2; text-decoration: none; }
        td a:hover { text-decoration: underline; }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .badge-changed { background: #c0392b33; color: #e74c3c; border: 1px solid #c0392b55; }
        .badge-new { background: #27ae6033; color: #2ecc71; border: 1px solid #27ae6055; }
        .badge-error { background: #e6740033; color: #e67e00; border: 1px solid #e6740055; }
        .badge-seed { background: #2980b933; color: #3498db; border: 1px solid #2980b955; }
        .url-text {
            max-width: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .snapshot-viewer {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            margin-top: 16px;
        }
        .snapshot-viewer iframe {
            width: 100%;
            height: 600px;
            border: none;
            border-radius: 0 0 8px 8px;
        }
        .snapshot-meta {
            padding: 16px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state h2 { color: #888; margin-bottom: 8px; }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <h1><span>&#9679;</span> Flock Archiver</h1>
            <nav>
                <a href="/">Dashboard</a>
                <a href="/urls">Tracked URLs</a>
            </nav>
        </div>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
