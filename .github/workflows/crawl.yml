name: Flock Archive

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Crawl mode'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - seeds-only
  repository_dispatch:
    types: [submit-url]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  snapshot-url:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install httpx playwright
          playwright install chromium
          playwright install-deps

      - name: Snapshot submitted URL
        run: |
          URL="${{ github.event.client_payload.url }}"
          python crawl.py --url "$URL"

      - name: Commit snapshot
        run: |
          git config user.name "FlockArchive Bot"
          git config user.email "bot@flockarchive.github.io"
          git add archive/ urls.json
          git diff --cached --quiet && echo "No changes" && exit 0
          URL="${{ github.event.client_payload.url }}"
          git commit -m "Snapshot: ${URL}"
          git pull --rebase origin main
          git push

  crawl-all:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install httpx playwright
          playwright install chromium
          playwright install-deps

      - name: Run crawler
        run: python crawl.py

      - name: Commit snapshots
        run: |
          git config user.name "FlockArchive Bot"
          git config user.email "bot@flockarchive.github.io"
          git add archive/ urls.json
          git diff --cached --quiet && echo "No changes" && exit 0
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M UTC")
          git commit -m "Crawl all: ${TIMESTAMP}"
          git push

  build-site:
    needs: [snapshot-url, crawl-all]
    if: always() && (needs.snapshot-url.result == 'success' || needs.crawl-all.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest
        run: git pull origin main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build static site
        run: python build_site.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build-site
    if: always() && needs.build-site.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
